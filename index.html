<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23db0000'/><text x='12' y='17' font-family='monospace' font-size='14' font-weight='bold' fill='%23ffffff' text-anchor='middle'>M</text></svg>" />
    <title>MarkItDown Studio — Offline Document to Markdown Converter</title>
    <meta name="description" content="Free, private document-to-Markdown converter powered by Microsoft MarkItDown. PDF, Office, images, audio and ZIP — parsed locally on your computer." />
    <script>
      // Set the theme class before first paint (default: dark).
      try {
        if (localStorage.getItem('offgrid-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        } else {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
